<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-label="Ciclo termodimórfico do Paracoccidioides: fase filamentosa em temperatura ambiente (micélios) transforma-se em fase leveduriforme com brotamentos múltiplos no corpo (37 graus celsius)">
  <title>Ciclo termodimórfico — Paracoccidioides brasiliensis</title>
  <desc>Esquema fisiopatológico: fase filamentosa (micélios) no solo em temperatura baixa → inalação de conídios → transformação na temperatura corporal em fase leveduriforme com célula-mãe e múltiplos brotamentos (roda de leme).</desc>

  <defs>
    <linearGradient id="ambiente" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(96,165,250,0.12)"/>
      <stop offset="100%" stop-color="rgba(96,165,250,0.04)"/>
    </linearGradient>
    <linearGradient id="corpo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(248,113,113,0.12)"/>
      <stop offset="100%" stop-color="rgba(251,191,36,0.06)"/>
    </linearGradient>
    <radialGradient id="micelio-color" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3a6db5"/>
    </radialGradient>
    <radialGradient id="levedura-color" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d89417"/>
    </radialGradient>
  </defs>

  <!-- Painel esquerdo: AMBIENTE (filamentosa) -->
  <rect x="20" y="40" width="240" height="240" rx="12" fill="url(#ambiente)" stroke="rgba(96,165,250,0.35)" stroke-width="1.2"/>
  <text x="140" y="65" text-anchor="middle" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" letter-spacing="0.05em">AMBIENTE</text>
  <text x="140" y="82" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Temperatura baixa · solo úmido</text>

  <!-- Micélios filamentosos -->
  <g stroke="url(#micelio-color)" stroke-width="2" fill="none" opacity="0.9">
    <!-- Hifa principal -->
    <path d="M 60 180 Q 90 150 130 170 Q 170 160 210 180" stroke-width="2.5"/>
    <!-- Hifas secundárias -->
    <path d="M 90 175 Q 100 195 95 220"/>
    <path d="M 130 168 Q 140 145 145 125"/>
    <path d="M 130 168 Q 150 185 165 210"/>
    <path d="M 170 165 Q 175 145 168 125"/>
    <path d="M 210 178 Q 220 200 215 230"/>
    <path d="M 60 180 Q 50 200 55 225"/>
  </g>

  <!-- Conídios (pequenas esferas nas pontas) -->
  <g fill="#60a5fa">
    <circle cx="55" cy="225" r="3.5"/>
    <circle cx="95" cy="220" r="3.2"/>
    <circle cx="145" cy="125" r="3.8"/>
    <circle cx="165" cy="210" r="3"/>
    <circle cx="168" cy="125" r="3.5"/>
    <circle cx="215" cy="230" r="3.2"/>
  </g>

  <!-- Label fase filamentosa -->
  <text x="140" y="255" text-anchor="middle" fill="#f4f7fb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Fase filamentosa</text>
  <text x="140" y="270" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">micélios · forma infectante</text>

  <!-- Seta de transformação central -->
  <g transform="translate(280, 160)">
    <path d="M 0 -10 L 40 0 L 0 10 L 8 0 Z" fill="#cad5dd" opacity="0.85"/>
    <text x="20" y="-22" text-anchor="middle" fill="#f4f7fb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">37°C</text>
    <text x="20" y="30" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9">inalação · corpo</text>
  </g>

  <!-- Painel direito: CORPO (leveduriforme) -->
  <rect x="340" y="40" width="240" height="240" rx="12" fill="url(#corpo)" stroke="rgba(251,191,36,0.35)" stroke-width="1.2"/>
  <text x="460" y="65" text-anchor="middle" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" letter-spacing="0.05em">CORPO HUMANO</text>
  <text x="460" y="82" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Temperatura corporal · 37°C</text>

  <!-- Levedura com brotamentos múltiplos (mini roda de leme) -->
  <g transform="translate(460, 170)">
    <!-- 8 brotamentos -->
    <circle cx="40" cy="0" r="7" fill="url(#levedura-color)" opacity="0.92"/>
    <circle cx="28" cy="-28" r="7" fill="url(#levedura-color)" opacity="0.92"/>
    <circle cx="0" cy="-40" r="7" fill="url(#levedura-color)" opacity="0.92"/>
    <circle cx="-28" cy="-28" r="7" fill="url(#levedura-color)" opacity="0.92"/>
    <circle cx="-40" cy="0" r="7" fill="url(#levedura-color)" opacity="0.92"/>
    <circle cx="-28" cy="28" r="7" fill="url(#levedura-color)" opacity="0.92"/>
    <circle cx="0" cy="40" r="7" fill="url(#levedura-color)" opacity="0.92"/>
    <circle cx="28" cy="28" r="7" fill="url(#levedura-color)" opacity="0.92"/>
    <!-- Conexões finas -->
    <g stroke="url(#levedura-color)" stroke-width="1.5" opacity="0.65">
      <line x1="20" y1="0" x2="33" y2="0"/>
      <line x1="14" y1="-14" x2="23" y2="-23"/>
      <line x1="0" y1="-20" x2="0" y2="-33"/>
      <line x1="-14" y1="-14" x2="-23" y2="-23"/>
      <line x1="-20" y1="0" x2="-33" y2="0"/>
      <line x1="-14" y1="14" x2="-23" y2="23"/>
      <line x1="0" y1="20" x2="0" y2="33"/>
      <line x1="14" y1="14" x2="23" y2="23"/>
    </g>
    <!-- Célula-mãe central -->
    <circle cx="0" cy="0" r="20" fill="url(#levedura-color)" stroke="#a16d10" stroke-width="1.5"/>
  </g>

  <!-- Label fase leveduriforme -->
  <text x="460" y="255" text-anchor="middle" fill="#f4f7fb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Fase leveduriforme</text>
  <text x="460" y="270" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">roda de leme · forma tecidual</text>

  <!-- Título superior -->
  <text x="300" y="25" text-anchor="middle" fill="#f4f7fb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Ciclo termodimórfico — Paracoccidioides brasiliensis</text>

  <!-- Legenda inferior -->
  <text x="300" y="307" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" opacity="0.85">
    A temperatura define a forma morfológica e a infectividade do fungo
  </text>
</svg>
