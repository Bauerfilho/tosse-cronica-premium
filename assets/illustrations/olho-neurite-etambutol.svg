<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Esquema visual: olho com sinais de neurite óptica retrobulbar — alteração da percepção verde-vermelho, escotoma central, perda de acuidade visual">
  <defs>
    <radialGradient id="scotoma" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#1F2937" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1F2937" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="redGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#8FA1A6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F87171" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <!-- Pálpebra externa (almond) -->
  <path d="M 20 60 Q 100 10, 180 60 Q 100 110, 20 60 Z" fill="none" stroke="#F4F7FB" stroke-width="2"/>
  <!-- Esclera -->
  <ellipse cx="100" cy="60" rx="60" ry="32" fill="#E5E7EB" opacity="0.7"/>
  <!-- Faixa verde-vermelha (alteração de cor) -->
  <ellipse cx="100" cy="60" rx="50" ry="22" fill="url(#redGreen)"/>
  <!-- Íris -->
  <circle cx="100" cy="60" r="22" fill="#3B5963" stroke="#0E2A2F" stroke-width="1.5"/>
  <!-- Escotoma central -->
  <circle cx="100" cy="60" r="22" fill="url(#scotoma)"/>
  <!-- Pupila -->
  <circle cx="100" cy="60" r="6" fill="#0E2A2F"/>
  <!-- Labels -->
  <text x="100" y="105" text-anchor="middle" font-family="-apple-system, SF Pro Text, Inter, sans-serif" font-size="9" font-weight="600" fill="#F4F7FB">visão turva · alteração verde-vermelho · escotoma central</text>
</svg>
