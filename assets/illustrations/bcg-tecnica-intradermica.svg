<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 160" role="img" aria-label="Técnica de aplicação intradérmica da BCG no deltoide direito: ângulo de 15 graus, agulha curta, volume 0.05 a 0.1 mL, pápula esperada de 6 a 8 milímetros">
  <defs>
    <linearGradient id="bcg-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="bcg-needle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9D6D9"/>
      <stop offset="100%" stop-color="#F4F7FB"/>
    </linearGradient>
  </defs>

  <!-- Vista esquemática do braço direito superior (deltoide) -->
  <path d="M24 50 Q24 30, 70 26 L210 30 Q232 32, 232 60 Q232 86, 210 88 L70 92 Q24 90, 24 50 Z" fill="url(#bcg-skin)" stroke="#34D399" stroke-width="1.5"/>

  <!-- Indicação do deltoide (área anatômica) -->
  <ellipse cx="128" cy="60" rx="60" ry="22" fill="none" stroke="#34D399" stroke-width="1" stroke-dasharray="4 3" opacity=".5"/>
  <text x="128" y="20" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" fill="#34D399" font-weight="700">DELTOIDE DIREITO · inserção inferior</text>

  <!-- Pápula esperada (6-8 mm) -->
  <ellipse cx="128" cy="60" rx="8" ry="3.5" fill="#FBBF24" opacity=".85"/>
  <ellipse cx="128" cy="60" rx="8" ry="3.5" fill="none" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="158" y="62" font-family="-apple-system, sans-serif" font-size="9" fill="#FBBF24" font-weight="700">pápula 6–8 mm</text>
  <text x="158" y="72" font-family="-apple-system, sans-serif" font-size="7" fill="#8FA1A6">("casca de laranja")</text>

  <!-- Agulha em ângulo de ~15° -->
  <line x1="160" y1="32" x2="132" y2="58" stroke="url(#bcg-needle)" stroke-width="3" stroke-linecap="round"/>

  <!-- Indicador do ângulo -->
  <path d="M132 58 L160 58" stroke="#8FA1A6" stroke-width="0.8" stroke-dasharray="2 2" opacity=".7"/>
  <path d="M148 58 Q148 50, 152 47" fill="none" stroke="#FBBF24" stroke-width="1"/>
  <text x="155" y="54" font-family="-apple-system, sans-serif" font-size="8" fill="#FBBF24" font-weight="700">~15°</text>

  <!-- Seringa de tuberculina -->
  <rect x="160" y="22" width="50" height="14" rx="2" fill="#16383F" stroke="#C9D6D9" stroke-width="1.5"/>
  <rect x="166" y="25" width="28" height="8" fill="#34D399" opacity=".6"/>
  <line x1="210" y1="29" x2="220" y2="29" stroke="#C9D6D9" stroke-width="3" stroke-linecap="round"/>
  <text x="182" y="34" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="7" fill="#F4F7FB" font-weight="700">0,05–0,1 mL</text>

  <!-- Indicador via -->
  <text x="78" y="120" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#34D399" font-weight="700">VIA INTRADÉRMICA</text>
  <text x="78" y="134" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#F87171" font-weight="600">NÃO subcutânea (risco abscesso)</text>

  <text x="200" y="120" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" fill="#FBBF24" font-weight="700">RN &lt;1a: 0,05 mL</text>
  <text x="200" y="134" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" fill="#FBBF24" font-weight="700">≥1a: 0,1 mL</text>
</svg>
