<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Aplicação intradérmica do PPD no antebraço">
  <defs>
    <linearGradient id="ppd-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="ppd-needle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9D6D9"/>
      <stop offset="100%" stop-color="#F4F7FB"/>
    </linearGradient>
  </defs>
  <!-- Antebraço (face anterior, vista lateral) -->
  <path d="M14 64 Q14 50, 30 48 L98 50 Q112 52, 114 64 Q112 76, 98 78 L30 80 Q14 78, 14 64 Z" fill="url(#ppd-skin)" stroke="#34D399" stroke-width="1.5"/>
  <!-- Indicação de 1/3 médio com hash -->
  <line x1="50" y1="44" x2="50" y2="84" stroke="#34D399" stroke-width="1" stroke-dasharray="3 3" opacity=".4"/>
  <line x1="78" y1="44" x2="78" y2="84" stroke="#34D399" stroke-width="1" stroke-dasharray="3 3" opacity=".4"/>
  <text x="64" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#8FA1A6" font-weight="600">1/3 médio</text>
  <!-- Pápula esperada (induração) -->
  <ellipse cx="64" cy="64" rx="7" ry="3.5" fill="#FBBF24" opacity=".75"/>
  <ellipse cx="64" cy="64" rx="7" ry="3.5" fill="none" stroke="#FBBF24" stroke-width="1.5"/>
  <!-- Agulha intradérmica em ângulo de ~15° -->
  <line x1="80" y1="42" x2="66" y2="62" stroke="url(#ppd-needle)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Seringa -->
  <rect x="80" y="30" width="36" height="12" rx="2" fill="#16383F" stroke="#C9D6D9" stroke-width="1.5"/>
  <rect x="84" y="33" width="20" height="6" fill="#FBBF24" opacity=".5"/>
  <line x1="116" y1="36" x2="124" y2="36" stroke="#C9D6D9" stroke-width="3" stroke-linecap="round"/>
  <!-- Indicador de volume -->
  <text x="94" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="7" fill="#0E2A2F" font-weight="700">0,1 mL</text>
  <!-- Legenda inferior -->
  <text x="64" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#F4F7FB" font-weight="600">PPD intradérmico</text>
  <text x="64" y="114" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#8FA1A6">Leitura em 48–72h · medir induração</text>
</svg>
