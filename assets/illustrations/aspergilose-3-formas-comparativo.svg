<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Aspergilose pulmonar — três formas comparadas</title>
  <desc id="desc">Esquema didático com três cenários pulmonares lado a lado: ABPA com bronquiectasias centrais em asma, aspergilose crônica com bola fúngica em cavidade tuberculosa, e aspergilose invasiva com angioinvasão em imunossuprimido.</desc>

  <defs>
    <linearGradient id="lungBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16383F"/>
      <stop offset="100%" stop-color="#0E2A2F"/>
    </linearGradient>
    <radialGradient id="cavidade" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#0E2A2F"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(248,113,113,0)"/>
      <stop offset="70%" stop-color="rgba(248,113,113,0.35)"/>
      <stop offset="100%" stop-color="rgba(248,113,113,0)"/>
    </radialGradient>
  </defs>

  <rect width="720" height="360" fill="#0E2A2F"/>

  <!-- ==== Coluna 1: ABPA ==== -->
  <g transform="translate(20,40)">
    <text x="110" y="-12" text-anchor="middle" fill="#34D399" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">ABPA</text>

    <!-- Pulmão silhueta -->
    <path d="M30,30 C20,90 25,180 50,240 C90,260 110,255 130,250 C150,255 170,260 210,240 C235,180 240,90 230,30 C200,15 165,12 130,15 C95,12 60,15 30,30 Z" fill="url(#lungBg)" stroke="#34D399" stroke-width="2" opacity="0.9"/>

    <!-- Brônquio central + bronquiectasias dilatadas -->
    <g stroke="#FBBF24" stroke-width="2.5" fill="none">
      <path d="M130,40 L130,100"/>
      <path d="M130,100 L95,140"/>
      <path d="M130,100 L165,140"/>
      <path d="M95,140 L75,170"/>
      <path d="M95,140 L110,180"/>
      <path d="M165,140 L150,180"/>
      <path d="M165,140 L185,170"/>
    </g>

    <!-- Dilatações brônquicas (bronquiectasias centrais) -->
    <g fill="#FBBF24" opacity="0.7">
      <ellipse cx="95" cy="140" rx="9" ry="6"/>
      <ellipse cx="165" cy="140" rx="9" ry="6"/>
      <ellipse cx="75" cy="170" rx="7" ry="5"/>
      <ellipse cx="110" cy="180" rx="7" ry="5"/>
      <ellipse cx="150" cy="180" rx="7" ry="5"/>
      <ellipse cx="185" cy="170" rx="7" ry="5"/>
    </g>

    <!-- Indicador "asma" inflamatório -->
    <g opacity="0.5">
      <circle cx="50" cy="120" r="4" fill="#34D399"/>
      <circle cx="62" cy="200" r="3" fill="#34D399"/>
      <circle cx="200" cy="110" r="4" fill="#34D399"/>
      <circle cx="208" cy="195" r="3" fill="#34D399"/>
    </g>

    <text x="110" y="285" text-anchor="middle" fill="#F4F7FB" font-family="-apple-system,sans-serif" font-size="11" font-weight="600">Asma / FC</text>
    <text x="110" y="300" text-anchor="middle" fill="#C9D6D9" font-family="-apple-system,sans-serif" font-size="10">Bronquiectasias centrais</text>
  </g>

  <!-- Separador vertical 1 -->
  <line x1="245" y1="60" x2="245" y2="300" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- ==== Coluna 2: Crônica/Aspergiloma ==== -->
  <g transform="translate(260,40)">
    <text x="110" y="-12" text-anchor="middle" fill="#FBBF24" font-family="-apple-system,sans-serif" font-size="14" font-weight="700">CRÔNICA · ASPERGILOMA</text>

    <!-- Pulmão silhueta com cavidade -->
    <path d="M30,30 C20,90 25,180 50,240 C90,260 110,255 130,250 C150,255 170,260 210,240 C235,180 240,90 230,30 C200,15 165,12 130,15 C95,12 60,15 30,30 Z" fill="url(#lungBg)" stroke="#34D399" stroke-width="2" opacity="0.9"/>

    <!-- Cavidade (apical, lobo superior) -->
    <ellipse cx="100" cy="80" rx="55" ry="50" fill="url(#cavidade)" stroke="#FBBF24" stroke-width="2.5"/>

    <!-- Bola fúngica (posição inferior por gravidade) -->
    <ellipse cx="100" cy="105" rx="30" ry="22" fill="#FBBF24" opacity="0.85"/>
    <ellipse cx="100" cy="105" rx="30" ry="22" fill="none" stroke="#92671A" stroke-width="1.5"/>

    <!-- Halo aéreo (sinal lua crescente) -->
    <path d="M55,80 Q55,55 100,55 Q145,55 145,80 Q138,92 100,90 Q62,92 55,80 Z" fill="rgba(11,18,32,0.6)" stroke="none"/>
    <text x="155" y="60" fill="#FBBF24" font-family="-apple-system,sans-serif" font-size="9" font-style="italic">↗ halo aéreo</text>
    <text x="155" y="72" fill="#FBBF24" font-family="-apple-system,sans-serif" font-size="9" font-style="italic">(lua crescente)</text>

    <!-- Sequela fibrótica TB residual periférica -->
    <g stroke="#8FA1A6" stroke-width="1" fill="none" opacity="0.6" stroke-dasharray="3,2">
      <path d="M45,50 Q60,75 50,100"/>
      <path d="M165,50 Q150,75 160,100"/>
      <path d="M50,135 L70,150"/>
    </g>

    <text x="110" y="285" text-anchor="middle" fill="#F4F7FB" font-family="-apple-system,sans-serif" font-size="11" font-weight="600">Sequela TB / DPOC</text>
    <text x="110" y="300" text-anchor="middle" fill="#C9D6D9" font-family="-apple-system,sans-serif" font-size="10">Bola fúngica em cavidade</text>
  </g>

  <!-- Separador vertical 2 -->
  <line x1="485" y1="60" x2="485" y2="300" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- ==== Coluna 3: Invasiva ==== -->
  <g transform="translate(500,40)">
    <text x="110" y="-12" text-anchor="middle" fill="#F87171" font-family="-apple-system,sans-serif" font-size="14" font-weight="700">INVASIVA</text>

    <!-- Pulmão silhueta -->
    <path d="M30,30 C20,90 25,180 50,240 C90,260 110,255 130,250 C150,255 170,260 210,240 C235,180 240,90 230,30 C200,15 165,12 130,15 C95,12 60,15 30,30 Z" fill="url(#lungBg)" stroke="#34D399" stroke-width="2" opacity="0.9"/>

    <!-- Nódulos múltiplos com halo (sinal halo) -->
    <g>
      <circle cx="80" cy="80" r="22" fill="url(#halo)"/>
      <circle cx="80" cy="80" r="10" fill="#F87171" opacity="0.85"/>

      <circle cx="160" cy="120" r="25" fill="url(#halo)"/>
      <circle cx="160" cy="120" r="12" fill="#F87171" opacity="0.85"/>

      <circle cx="110" cy="180" r="20" fill="url(#halo)"/>
      <circle cx="110" cy="180" r="9" fill="#F87171" opacity="0.85"/>
    </g>

    <!-- Infiltrado bilateral difuso (sombreado) -->
    <g fill="#F87171" opacity="0.15">
      <ellipse cx="60" cy="160" rx="30" ry="20"/>
      <ellipse cx="180" cy="200" rx="35" ry="22"/>
      <ellipse cx="50" cy="220" rx="25" ry="15"/>
    </g>

    <text x="180" y="60" fill="#F87171" font-family="-apple-system,sans-serif" font-size="9" font-style="italic">↗ sinal do halo</text>

    <text x="110" y="285" text-anchor="middle" fill="#F4F7FB" font-family="-apple-system,sans-serif" font-size="11" font-weight="600">Imunossuprimido</text>
    <text x="110" y="300" text-anchor="middle" fill="#C9D6D9" font-family="-apple-system,sans-serif" font-size="10">Angioinvasão + halo precoce</text>
  </g>

  <!-- Rodapé didático -->
  <text x="360" y="345" text-anchor="middle" fill="#8FA1A6" font-family="-apple-system,sans-serif" font-size="10" font-style="italic">Mesmo fungo (Aspergillus fumigatus) · três doenças distintas · o hospedeiro define</text>
</svg>
