<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-label="Esquema fisiopatológico da cavitação tuberculosa: granuloma, necrose caseosa, drenagem brônquica, cavidade">
  <defs>
    <linearGradient id="cavbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity=".05"/>
    </linearGradient>
    <pattern id="parenchyma" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="3" fill="none" stroke="#8FA1A6" stroke-width=".7" opacity=".4"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="480" height="240" rx="14" fill="url(#cavbg)"/>

  <!-- Background de parênquima -->
  <rect x="20" y="20" width="440" height="180" rx="12" fill="url(#parenchyma)"/>

  <!-- Etapa 1: Granuloma com necrose caseosa central -->
  <g transform="translate(100, 110)">
    <circle r="44" fill="rgba(52,211,153,.08)" stroke="#34D399" stroke-width="1.5"/>
    <!-- Anel de macrófagos -->
    <g stroke="#34D399" stroke-width="1" fill="none" opacity=".7">
      <circle cx="-22" cy="-18" r="4"/>
      <circle cx="22" cy="-22" r="4"/>
      <circle cx="28" cy="6" r="4"/>
      <circle cx="-26" cy="10" r="4"/>
      <circle cx="-8" cy="26" r="4"/>
      <circle cx="18" cy="26" r="4"/>
    </g>
    <!-- Necrose caseosa central -->
    <circle r="18" fill="#FBBF24" opacity=".7"/>
    <text x="0" y="3" text-anchor="middle" font-family="-apple-system, SF Pro Display, system-ui, sans-serif" font-size="8" fill="#0E2A2F" font-weight="700">caseum</text>
  </g>
  <text x="100" y="180" text-anchor="middle" font-family="-apple-system, SF Pro Display, system-ui, sans-serif" font-size="10" fill="#C9D6D9" font-weight="600">Granuloma</text>
  <text x="100" y="194" text-anchor="middle" font-family="-apple-system, SF Pro Display, system-ui, sans-serif" font-size="8" fill="#8FA1A6">com necrose caseosa</text>

  <!-- Seta 1 -->
  <path d="M 158 110 L 198 110" fill="none" stroke="#8FA1A6" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="198,110 190,106 190,114" fill="#8FA1A6"/>

  <!-- Etapa 2: Drenagem brônquica (caseum sendo eliminado) -->
  <g transform="translate(240, 110)">
    <!-- Cavidade em formação -->
    <circle r="40" fill="rgba(251,191,36,.18)" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="4,3"/>
    <!-- Brônquio de drenagem -->
    <path d="M 30,-10 Q 60,-20 90,-10" fill="none" stroke="#C9D6D9" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    <path d="M 30,-2 Q 60,-12 90,-2" fill="none" stroke="#C9D6D9" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    <!-- Caseum saindo -->
    <g fill="#FBBF24" opacity=".7">
      <circle cx="42" cy="-12" r="3.5"/>
      <circle cx="58" cy="-14" r="3"/>
      <circle cx="72" cy="-12" r="3.5"/>
    </g>
  </g>
  <text x="240" y="180" text-anchor="middle" font-family="-apple-system, SF Pro Display, system-ui, sans-serif" font-size="10" fill="#C9D6D9" font-weight="600">Drenagem brônquica</text>
  <text x="240" y="194" text-anchor="middle" font-family="-apple-system, SF Pro Display, system-ui, sans-serif" font-size="8" fill="#8FA1A6">caseum é expectorado</text>

  <!-- Seta 2 -->
  <path d="M 320 110 L 360 110" fill="none" stroke="#8FA1A6" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="360,110 352,106 352,114" fill="#8FA1A6"/>

  <!-- Etapa 3: Cavidade permanente -->
  <g transform="translate(400, 110)">
    <!-- Parede fibrótica -->
    <circle r="42" fill="#0E2A2F" stroke="#FBBF24" stroke-width="2"/>
    <!-- Interior vazio (hipertransparente) -->
    <circle r="32" fill="#0E2A2F"/>
    <!-- Brônquio conectando -->
    <path d="M 30,2 Q 50,4 65,6" fill="none" stroke="#C9D6D9" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
  </g>
  <text x="400" y="180" text-anchor="middle" font-family="-apple-system, SF Pro Display, system-ui, sans-serif" font-size="10" fill="#C9D6D9" font-weight="600">Cavidade</text>
  <text x="400" y="194" text-anchor="middle" font-family="-apple-system, SF Pro Display, system-ui, sans-serif" font-size="8" fill="#FBBF24">sequela permanente</text>
</svg>
