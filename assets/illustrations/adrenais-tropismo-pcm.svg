<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Corte abdominal coronal mostrando rins com adrenais aumentadas bilateralmente por tropismo do Paracoccidioides">
  <title>Adrenais aumentadas — tropismo do P. brasiliensis</title>
  <desc>Esquema anatômico do tropismo fúngico pelas adrenais: ambas adrenais aumentadas e infiltradas por granuloma fúngico, causando insuficiência adrenal clínica em 10-15% dos casos de PCM disseminada.</desc>

  <defs>
    <radialGradient id="abd-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1d22"/>
      <stop offset="100%" stop-color="#0a0c0f"/>
    </radialGradient>
    <radialGradient id="rim-color" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a64457" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#6b2937" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="adrenal-color" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a66d10" stop-opacity="0.88"/>
    </radialGradient>
    <radialGradient id="granuloma-fungo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4f7fb" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8f9bad" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#abd-bg)"/>

  <!-- Coluna vertebral central (esboço) -->
  <rect x="190" y="60" width="20" height="280" fill="#2a3035" opacity="0.5"/>
  <g fill="#2a3035" opacity="0.6">
    <ellipse cx="200" cy="100" rx="14" ry="8"/>
    <ellipse cx="200" cy="140" rx="14" ry="8"/>
    <ellipse cx="200" cy="180" rx="14" ry="8"/>
    <ellipse cx="200" cy="220" rx="14" ry="8"/>
    <ellipse cx="200" cy="260" rx="14" ry="8"/>
    <ellipse cx="200" cy="300" rx="14" ry="8"/>
  </g>

  <!-- ADRENAL ESQUERDA (do paciente — direita da imagem) — AUMENTADA -->
  <g transform="translate(265, 140)">
    <!-- Forma triangular irregular aumentada -->
    <path d="M -22 -8 Q -28 -25 -10 -32 Q 15 -38 30 -25 Q 38 -8 32 8 Q 25 22 5 22 Q -15 22 -22 8 Z"
          fill="url(#adrenal-color)" stroke="#7a5212" stroke-width="1.5"/>
    <!-- Granulomas fúngicos internos (manchas claras) -->
    <circle cx="-5" cy="-15" r="6" fill="url(#granuloma-fungo)" opacity="0.65"/>
    <circle cx="12" cy="0" r="7" fill="url(#granuloma-fungo)" opacity="0.7"/>
    <circle cx="-8" cy="10" r="5" fill="url(#granuloma-fungo)" opacity="0.6"/>
    <circle cx="20" cy="-10" r="4" fill="url(#granuloma-fungo)" opacity="0.55"/>
  </g>

  <!-- ADRENAL DIREITA (do paciente — esquerda da imagem) — AUMENTADA -->
  <g transform="translate(135, 140)">
    <path d="M -30 -8 Q -38 -25 -15 -32 Q 10 -38 22 -25 Q 28 -8 22 8 Q 15 22 -5 22 Q -25 22 -30 8 Z"
          fill="url(#adrenal-color)" stroke="#7a5212" stroke-width="1.5"/>
    <!-- Granulomas fúngicos internos -->
    <circle cx="-12" cy="-15" r="5" fill="url(#granuloma-fungo)" opacity="0.65"/>
    <circle cx="5" cy="-5" r="7" fill="url(#granuloma-fungo)" opacity="0.7"/>
    <circle cx="-8" cy="8" r="6" fill="url(#granuloma-fungo)" opacity="0.6"/>
    <circle cx="15" cy="10" r="4" fill="url(#granuloma-fungo)" opacity="0.55"/>
  </g>

  <!-- RIM ESQUERDO -->
  <ellipse cx="270" cy="225" rx="48" ry="70" fill="url(#rim-color)" stroke="#4a1f28" stroke-width="1.5"/>
  <!-- Hilo renal -->
  <ellipse cx="232" cy="225" rx="8" ry="14" fill="#2a0c12" opacity="0.7"/>

  <!-- RIM DIREITO -->
  <ellipse cx="130" cy="225" rx="48" ry="70" fill="url(#rim-color)" stroke="#4a1f28" stroke-width="1.5"/>
  <ellipse cx="168" cy="225" rx="8" ry="14" fill="#2a0c12" opacity="0.7"/>

  <!-- Ureteres descendentes (esboço) -->
  <g stroke="#4a1f28" stroke-width="1.2" fill="none" opacity="0.65">
    <path d="M 232 282 Q 245 320 260 360"/>
    <path d="M 168 282 Q 155 320 140 360"/>
  </g>

  <!-- Labels D/E -->
  <text x="65" y="100" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" opacity="0.75">D</text>
  <text x="335" y="100" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" opacity="0.75">E</text>

  <!-- Setas indicativas pra adrenais -->
  <g stroke="#fbbf24" stroke-width="1.8" fill="none" opacity="0.85">
    <path d="M 80 65 Q 110 100 130 130"/>
    <path d="M 320 65 Q 290 100 270 130"/>
  </g>
  <polygon points="125,128 134,132 130,124" fill="#fbbf24" opacity="0.9"/>
  <polygon points="275,128 266,132 270,124" fill="#fbbf24" opacity="0.9"/>

  <!-- Labels adrenais aumentadas -->
  <text x="80" y="55" text-anchor="middle" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" opacity="0.92">Adrenal D</text>
  <text x="80" y="40" text-anchor="middle" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="500" opacity="0.8">~3× volume normal</text>

  <text x="320" y="55" text-anchor="middle" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" opacity="0.92">Adrenal E</text>
  <text x="320" y="40" text-anchor="middle" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="500" opacity="0.8">com granulomas</text>

  <!-- Legenda inferior -->
  <text x="200" y="385" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" letter-spacing="0.04em" opacity="0.85">
    Tropismo adrenal — ~50% acometidos · ~10-15% insuficiência clínica
  </text>
</svg>
