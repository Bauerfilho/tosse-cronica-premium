<svg viewBox="0 0 480 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fluxograma sequencial: reintrodução pós-hepatotoxicidade dos fármacos do RIPE na ordem R, depois isoniazida, depois pirazinamida, com pausa de 3 a 7 dias para reavaliar transaminases entre cada introdução">
  <defs>
    <linearGradient id="rhpR" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FBBF24"/><stop offset="100%" stop-color="#B45309"/></linearGradient>
    <linearGradient id="rhpH" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#34D399"/><stop offset="100%" stop-color="#0F766E"/></linearGradient>
    <linearGradient id="rhpP" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#60A5FA"/><stop offset="100%" stop-color="#1E40AF"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8FA1A6"/>
    </marker>
  </defs>
  <!-- Linha do tempo base -->
  <line x1="20" y1="90" x2="460" y2="90" stroke="#374151" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <!-- R -->
  <circle cx="80" cy="90" r="28" fill="url(#rhpR)" stroke="#0E2A2F" stroke-width="2"/>
  <text x="80" y="96" text-anchor="middle" font-family="-apple-system, SF Pro Display, Inter, sans-serif" font-size="22" font-weight="800" fill="#0E2A2F">R</text>
  <text x="80" y="40" text-anchor="middle" font-family="-apple-system, SF Pro Text, Inter, sans-serif" font-size="11" font-weight="600" fill="#F4F7FB">1º Rifampicina</text>
  <text x="80" y="145" text-anchor="middle" font-family="-apple-system, SF Pro Text, Inter, sans-serif" font-size="9" fill="#8FA1A6">Mais essencial</text>
  <text x="80" y="158" text-anchor="middle" font-family="-apple-system, SF Pro Text, Inter, sans-serif" font-size="9" fill="#8FA1A6">do esquema</text>
  <!-- Pausa 1 -->
  <rect x="125" y="80" width="70" height="20" rx="10" fill="rgba(255,255,255,0.05)" stroke="#374151" stroke-dasharray="3 3"/>
  <text x="160" y="93" text-anchor="middle" font-family="-apple-system, SF Pro Text, Inter, sans-serif" font-size="9" fill="#8FA1A6" font-style="italic">pausa 3-7d</text>
  <text x="160" y="120" text-anchor="middle" font-family="-apple-system, SF Pro Text, Inter, sans-serif" font-size="8" fill="#8FA1A6">reavaliar TGO/TGP</text>
  <!-- H -->
  <circle cx="240" cy="90" r="28" fill="url(#rhpH)" stroke="#0E2A2F" stroke-width="2"/>
  <text x="240" y="96" text-anchor="middle" font-family="-apple-system, SF Pro Display, Inter, sans-serif" font-size="22" font-weight="800" fill="#0E2A2F">H</text>
  <text x="240" y="40" text-anchor="middle" font-family="-apple-system, SF Pro Text, Inter, sans-serif" font-size="11" font-weight="600" fill="#F4F7FB">2º Isoniazida</text>
  <text x="240" y="145" text-anchor="middle" font-family="-apple-system, SF Pro Text, Inter, sans-serif" font-size="9" fill="#8FA1A6">Hepatotoxicidade</text>
  <text x="240" y="158" text-anchor="middle" font-family="-apple-system, SF Pro Text, Inter, sans-serif" font-size="9" fill="#8FA1A6">intermediária</text>
  <!-- Pausa 2 -->
  <rect x="285" y="80" width="70" height="20" rx="10" fill="rgba(255,255,255,0.05)" stroke="#374151" stroke-dasharray="3 3"/>
  <text x="320" y="93" text-anchor="middle" font-family="-apple-system, SF Pro Text, Inter, sans-serif" font-size="9" fill="#8FA1A6" font-style="italic">pausa 3-7d</text>
  <text x="320" y="120" text-anchor="middle" font-family="-apple-system, SF Pro Text, Inter, sans-serif" font-size="8" fill="#8FA1A6">reavaliar TGO/TGP</text>
  <!-- P -->
  <circle cx="400" cy="90" r="28" fill="url(#rhpP)" stroke="#0E2A2F" stroke-width="2"/>
  <text x="400" y="96" text-anchor="middle" font-family="-apple-system, SF Pro Display, Inter, sans-serif" font-size="22" font-weight="800" fill="#0E2A2F">P</text>
  <text x="400" y="40" text-anchor="middle" font-family="-apple-system, SF Pro Text, Inter, sans-serif" font-size="11" font-weight="600" fill="#F4F7FB">3º Pirazinamida</text>
  <text x="400" y="145" text-anchor="middle" font-family="-apple-system, SF Pro Text, Inter, sans-serif" font-size="9" fill="#8FA1A6">Mais hepatotóxica</text>
  <text x="400" y="158" text-anchor="middle" font-family="-apple-system, SF Pro Text, Inter, sans-serif" font-size="9" fill="#8FA1A6">— testar por último</text>
</svg>
