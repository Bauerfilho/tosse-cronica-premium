<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 128" role="img" aria-label="Janela imunológica: resposta imune celular leva até 8 semanas após exposição">
  <defs>
    <linearGradient id="ji-response" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F87171" stop-opacity=".15"/>
      <stop offset="60%" stop-color="#FBBF24" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity=".9"/>
    </linearGradient>
  </defs>
  <!-- Eixo horizontal (tempo) -->
  <line x1="20" y1="92" x2="240" y2="92" stroke="#8FA1A6" stroke-width="1.5"/>
  <!-- Marcadores semanais -->
  <line x1="20" y1="88" x2="20" y2="96" stroke="#8FA1A6" stroke-width="1.5"/>
  <text x="20" y="108" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#8FA1A6">Sem 0</text>
  <text x="20" y="118" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="7" fill="#8FA1A6">exposição</text>

  <line x1="75" y1="88" x2="75" y2="96" stroke="#8FA1A6" stroke-width="1"/>
  <text x="75" y="108" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#8FA1A6">Sem 2</text>

  <line x1="130" y1="88" x2="130" y2="96" stroke="#8FA1A6" stroke-width="1"/>
  <text x="130" y="108" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#8FA1A6">Sem 4</text>

  <line x1="185" y1="88" x2="185" y2="96" stroke="#8FA1A6" stroke-width="1"/>
  <text x="185" y="108" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#8FA1A6">Sem 6</text>

  <line x1="240" y1="88" x2="240" y2="96" stroke="#FBBF24" stroke-width="2"/>
  <text x="240" y="108" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#FBBF24" font-weight="700">Sem 8</text>
  <text x="240" y="118" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="7" fill="#FBBF24" font-weight="600">repetir PPD</text>

  <!-- Curva de resposta imune crescente -->
  <path d="M20 88 Q90 86, 130 70 Q190 40, 240 24" fill="none" stroke="url(#ji-response)" stroke-width="3" stroke-linecap="round"/>
  <path d="M20 88 L75 84 L130 70 L185 44 L240 24" fill="url(#ji-response)" opacity=".25"/>

  <!-- Marcador na sem 8 (resposta detectável) -->
  <circle cx="240" cy="24" r="5" fill="#34D399" stroke="#F4F7FB" stroke-width="1.5"/>
  <text x="240" y="14" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#34D399" font-weight="700">PPD+</text>

  <!-- Marcador inicial (resposta ainda não detectável) -->
  <circle cx="20" cy="88" r="4" fill="#F87171" stroke="#F4F7FB" stroke-width="1.5"/>

  <!-- Zona da janela -->
  <rect x="20" y="20" width="220" height="68" fill="none" stroke="#FBBF24" stroke-width="1" stroke-dasharray="4 4" opacity=".4"/>
  <text x="128" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" fill="#FBBF24" font-weight="700">JANELA IMUNOLÓGICA · até 8 semanas</text>
</svg>
