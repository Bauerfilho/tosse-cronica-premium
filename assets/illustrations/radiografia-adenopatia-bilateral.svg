<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" role="img" aria-label="Radiografia esquemática: adenopatia hilar bilateral sugestiva de sarcoidose">
  <defs>
    <linearGradient id="rxbbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity=".03"/>
    </linearGradient>
    <radialGradient id="rxbaden" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity=".75"/>
      <stop offset="70%" stop-color="#FBBF24" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="320" height="360" rx="14" fill="url(#rxbbg)"/>

  <!-- Silhueta torácica (mesma da unilateral pra coerência didática) -->
  <g transform="translate(160, 180)" stroke="#8FA1A6" stroke-width="1.4" fill="none">
    <path d="M -110,-110 Q -120,-30 -110,80 L -90,110 L 90,110 L 110,80 Q 120,-30 110,-110 L 70,-130 L -70,-130 Z" opacity=".55"/>
    <path d="M -100,-60 Q -50,-50 0,-55" opacity=".25"/>
    <path d="M 100,-60 Q 50,-50 0,-55" opacity=".25"/>
    <path d="M -100,-20 Q -50,-10 0,-15" opacity=".25"/>
    <path d="M 100,-20 Q 50,-10 0,-15" opacity=".25"/>
    <path d="M -100,20 Q -50,30 0,25" opacity=".25"/>
    <path d="M 100,20 Q 50,30 0,25" opacity=".25"/>
    <line x1="0" y1="-130" x2="0" y2="110" stroke="#8FA1A6" stroke-width="1" opacity=".4" stroke-dasharray="3,3"/>
    <path d="M -8,40 Q -38,30 -42,70 Q -38,100 0,100 Q 30,100 25,70 Q 22,30 -8,40 Z" opacity=".5"/>
    <path d="M -100,90 Q -50,110 0,100 Q 50,90 100,90" stroke="#8FA1A6" stroke-width="1.5" opacity=".7"/>
  </g>

  <!-- ADENOPATIA HILAR BILATERAL — direita -->
  <g transform="translate(120, 175)">
    <circle r="32" fill="url(#rxbaden)"/>
    <ellipse cx="-6" cy="-4" rx="9" ry="6" fill="#FBBF24" opacity=".45"/>
    <ellipse cx="8" cy="2" rx="7" ry="5" fill="#FBBF24" opacity=".4"/>
    <ellipse cx="-2" cy="8" rx="6" ry="4" fill="#FBBF24" opacity=".35"/>
  </g>

  <!-- ADENOPATIA HILAR BILATERAL — esquerda -->
  <g transform="translate(200, 175)">
    <circle r="32" fill="url(#rxbaden)"/>
    <ellipse cx="6" cy="-4" rx="9" ry="6" fill="#FBBF24" opacity=".45"/>
    <ellipse cx="-8" cy="2" rx="7" ry="5" fill="#FBBF24" opacity=".4"/>
    <ellipse cx="2" cy="8" rx="6" ry="4" fill="#FBBF24" opacity=".35"/>
  </g>

  <!-- Marker -->
  <text x="160" y="125" text-anchor="middle" font-family="-apple-system, SF Pro Display, system-ui, sans-serif" font-size="10" fill="#FBBF24" font-weight="700" letter-spacing=".06em">BILATERAL → DDx SARCOIDOSE</text>

  <!-- Anatomia -->
  <text x="280" y="60" text-anchor="end" font-family="-apple-system, SF Pro Display, system-ui, sans-serif" font-size="10" fill="#8FA1A6" font-weight="600">R</text>
  <text x="40" y="60" font-family="-apple-system, SF Pro Display, system-ui, sans-serif" font-size="10" fill="#8FA1A6" font-weight="600">L</text>

  <!-- Legenda inferior -->
  <text x="160" y="335" text-anchor="middle" font-family="-apple-system, SF Pro Display, system-ui, sans-serif" font-size="11" fill="#C9D6D9" font-weight="600">DDx clássico: sarcoidose (Estágio I)</text>
  <text x="160" y="349" text-anchor="middle" font-family="-apple-system, SF Pro Display, system-ui, sans-serif" font-size="9" fill="#8FA1A6" font-style="italic">Adenopatia hilar bilateral simétrica</text>
</svg>
