<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-label="Esquema da dinâmica de infecção da tuberculose: alvéolo, granuloma e cavidade">
  <defs>
    <linearGradient id="dibg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity=".06"/>
    </linearGradient>
    <radialGradient id="digran" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity=".5"/>
      <stop offset="60%" stop-color="#34D399" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dicave" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0E2A2F" stop-opacity="0"/>
      <stop offset="70%" stop-color="#0E2A2F" stop-opacity=".0"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity=".4"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="480" height="200" rx="14" fill="url(#dibg)"/>

  <!-- Etapa 1: Alvéolo com bacilo entrando -->
  <g transform="translate(80, 100)">
    <circle r="42" fill="none" stroke="#8FA1A6" stroke-width="1.5" opacity=".7"/>
    <circle r="42" fill="rgba(255,255,255,.03)"/>
    <!-- Bacilo (bastonete) entrando -->
    <g transform="translate(-25, -8) rotate(35)">
      <rect x="-8" y="-2" width="16" height="4" rx="2" fill="#34D399"/>
    </g>
    <g transform="translate(15, 12) rotate(-20)">
      <rect x="-6" y="-1.5" width="12" height="3" rx="1.5" fill="#34D399" opacity=".7"/>
    </g>
    <text x="0" y="62" text-anchor="middle" font-family="-apple-system, SF Pro Display, system-ui, sans-serif" font-size="11" fill="#C9D6D9" font-weight="600">Alvéolo</text>
    <text x="0" y="76" text-anchor="middle" font-family="-apple-system, SF Pro Display, system-ui, sans-serif" font-size="9" fill="#8FA1A6">Bacilo inalado</text>
  </g>

  <!-- Seta 1 -->
  <path d="M 138 100 L 178 100" fill="none" stroke="#8FA1A6" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="178,100 170,96 170,104" fill="#8FA1A6"/>

  <!-- Etapa 2: Granuloma -->
  <g transform="translate(240, 100)">
    <circle r="42" fill="url(#digran)" stroke="#34D399" stroke-width="1.5" opacity=".9"/>
    <!-- Macrófagos epitelioides envolvendo bacilo -->
    <circle cx="0" cy="0" r="6" fill="#34D399" opacity=".4"/>
    <g>
      <circle cx="-14" cy="-8" r="5" fill="none" stroke="#34D399" stroke-width="1.2" opacity=".8"/>
      <circle cx="12" cy="-12" r="5" fill="none" stroke="#34D399" stroke-width="1.2" opacity=".8"/>
      <circle cx="16" cy="6" r="5" fill="none" stroke="#34D399" stroke-width="1.2" opacity=".8"/>
      <circle cx="-12" cy="14" r="5" fill="none" stroke="#34D399" stroke-width="1.2" opacity=".8"/>
      <circle cx="2" cy="18" r="5" fill="none" stroke="#34D399" stroke-width="1.2" opacity=".8"/>
      <circle cx="-18" cy="2" r="5" fill="none" stroke="#34D399" stroke-width="1.2" opacity=".8"/>
    </g>
    <text x="0" y="62" text-anchor="middle" font-family="-apple-system, SF Pro Display, system-ui, sans-serif" font-size="11" fill="#C9D6D9" font-weight="600">Granuloma</text>
    <text x="0" y="76" text-anchor="middle" font-family="-apple-system, SF Pro Display, system-ui, sans-serif" font-size="9" fill="#8FA1A6">Latência (~90%)</text>
  </g>

  <!-- Seta 2 (com indicação de reativação) -->
  <path d="M 298 100 L 338 100" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="338,100 330,96 330,104" fill="#FBBF24"/>
  <text x="318" y="92" text-anchor="middle" font-family="-apple-system, SF Pro Display, system-ui, sans-serif" font-size="8" fill="#FBBF24" font-style="italic">reativação</text>

  <!-- Etapa 3: Cavidade -->
  <g transform="translate(400, 100)">
    <circle r="42" fill="url(#dicave)" stroke="#FBBF24" stroke-width="1.5"/>
    <!-- Buraco interior hipertransparente -->
    <circle r="28" fill="#0E2A2F" stroke="#FBBF24" stroke-width="1.2" opacity=".9"/>
    <!-- Bacilos no interior (alta carga) -->
    <g>
      <rect x="-10" y="-6" width="6" height="2" rx="1" fill="#FBBF24"/>
      <rect x="-2" y="2" width="6" height="2" rx="1" fill="#FBBF24"/>
      <rect x="8" y="-2" width="6" height="2" rx="1" fill="#FBBF24"/>
      <rect x="-6" y="10" width="6" height="2" rx="1" fill="#FBBF24"/>
      <rect x="4" y="-12" width="6" height="2" rx="1" fill="#FBBF24"/>
    </g>
    <text x="0" y="62" text-anchor="middle" font-family="-apple-system, SF Pro Display, system-ui, sans-serif" font-size="11" fill="#C9D6D9" font-weight="600">Cavidade</text>
    <text x="0" y="76" text-anchor="middle" font-family="-apple-system, SF Pro Display, system-ui, sans-serif" font-size="9" fill="#FBBF24">Bacilífero</text>
  </g>
</svg>
