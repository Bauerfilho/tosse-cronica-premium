<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" role="img" aria-label="Evolução normal da cicatriz vacinal da BCG ao longo de 6 a 12 semanas: pápula, pústula, úlcera, cicatriz">
  <!-- Linha temporal de base -->
  <line x1="20" y1="90" x2="300" y2="90" stroke="#8FA1A6" stroke-width="1.5"/>

  <!-- Estágio 1: Pápula imediata (Dia 0) -->
  <g transform="translate(40 60)">
    <circle r="8" fill="#FBBF24" opacity=".55" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="0" y="38" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#8FA1A6">Dia 0</text>
    <text x="0" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" fill="#F4F7FB" font-weight="600">Pápula</text>
  </g>

  <!-- Estágio 2: Nódulo (2-4 sem) -->
  <g transform="translate(110 60)">
    <circle r="10" fill="#F87171" opacity=".55" stroke="#F87171" stroke-width="1.5"/>
    <circle r="4" fill="#FBBF24" opacity=".8"/>
    <text x="0" y="38" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#8FA1A6">2–4 sem</text>
    <text x="0" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" fill="#F4F7FB" font-weight="600">Nódulo · Pústula</text>
  </g>

  <!-- Estágio 3: Úlcera (4-8 sem) -->
  <g transform="translate(190 60)">
    <circle r="12" fill="#F87171" opacity=".4" stroke="#7F1D1D" stroke-width="1.5"/>
    <circle r="6" fill="#7F1D1D" opacity=".7"/>
    <!-- gota de drenagem -->
    <path d="M 4 8 Q 6 14, 4 18" fill="none" stroke="#FBBF24" stroke-width="1" opacity=".7"/>
    <text x="0" y="38" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#8FA1A6">4–8 sem</text>
    <text x="0" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" fill="#F4F7FB" font-weight="600">Úlcera (drena)</text>
  </g>

  <!-- Estágio 4: Cicatriz definitiva (6-12 sem) -->
  <g transform="translate(270 60)">
    <circle r="6" fill="rgba(244, 247, 251, 0.35)" stroke="#C9D6D9" stroke-width="1.5"/>
    <circle r="3" fill="rgba(0,0,0,0.2)"/>
    <text x="0" y="38" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#34D399" font-weight="700">6–12 sem</text>
    <text x="0" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" fill="#34D399" font-weight="700">Cicatriz definitiva</text>
  </g>

  <!-- Conectores -->
  <line x1="50" y1="90" x2="100" y2="90" stroke="#8FA1A6" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="120" y1="90" x2="180" y2="90" stroke="#8FA1A6" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="200" y1="90" x2="262" y2="90" stroke="#8FA1A6" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Marcador EVOLUÇÃO NORMAL no topo -->
  <text x="160" y="20" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#34D399" font-weight="700">EVOLUÇÃO NORMAL · NÃO é evento adverso</text>

  <!-- Tamanho cicatriz final -->
  <text x="160" y="128" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#8FA1A6">Cicatriz final: pápula deprimida 3–7 mm</text>
</svg>
