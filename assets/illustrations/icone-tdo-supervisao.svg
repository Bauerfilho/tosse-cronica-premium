<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Tratamento Diretamente Observado: profissional supervisiona o paciente tomando a dose">
  <defs>
    <linearGradient id="tdo-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <!-- Profissional (esquerda) -->
  <g transform="translate(28 48)">
    <circle r="10" fill="none" stroke="url(#tdo-grad)" stroke-width="2"/>
    <path d="M-14 32 C-12 18, -4 14, 0 14 C4 14, 12 18, 14 32" fill="none" stroke="url(#tdo-grad)" stroke-width="2" stroke-linecap="round"/>
    <!-- Estetoscópio implícito -->
    <path d="M-6 16 Q-8 22, -6 28" fill="none" stroke="#34D399" stroke-width="1"/>
    <circle cx="-5" cy="28" r="1.5" fill="#34D399"/>
  </g>

  <!-- Cápsula no centro (TDO) -->
  <g transform="translate(64 64)">
    <rect x="-10" y="-5" width="20" height="10" rx="5" fill="#FBBF24" stroke="#B97A0E" stroke-width="1"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#B97A0E" stroke-width=".8"/>
  </g>

  <!-- Paciente (direita) -->
  <g transform="translate(100 48)">
    <circle r="10" fill="none" stroke="#C9D6D9" stroke-width="2"/>
    <path d="M-14 32 C-12 18, -4 14, 0 14 C4 14, 12 18, 14 32" fill="none" stroke="#C9D6D9" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Seta supervisão (do profissional pra cápsula) -->
  <path d="M40 60 L52 62" fill="none" stroke="#34D399" stroke-width="1.5" marker-end="url(#tdo-arrow)"/>
  <path d="M76 62 L88 60" fill="none" stroke="#C9D6D9" stroke-width="1.5" marker-end="url(#tdo-arrow)"/>
  <defs>
    <marker id="tdo-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L5 3 L0 6 Z" fill="#34D399"/>
    </marker>
  </defs>

  <!-- Legenda -->
  <text x="64" y="20" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#34D399" font-weight="700">TDO</text>
  <text x="64" y="110" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#8FA1A6">Supervisão presencial</text>
  <text x="64" y="120" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="7" fill="#8FA1A6">UBS · agente comunitário</text>
</svg>
