<svg viewBox="0 0 120 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cena didática: frasco coletor de urina com coloração alaranjada inofensiva por rifampicina">
  <defs>
    <linearGradient id="urineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFF" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#FFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFF" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <!-- Bandeja -->
  <rect x="20" y="86" width="80" height="4" rx="2" fill="#16383F" opacity="0.7"/>
  <!-- Tampa do frasco -->
  <rect x="44" y="18" width="32" height="10" rx="2" fill="#0E2A2F" stroke="#34D399" stroke-width="1.25"/>
  <line x1="48" y1="22" x2="72" y2="22" stroke="#34D399" stroke-width="0.5" opacity="0.6"/>
  <!-- Gargalo -->
  <rect x="48" y="28" width="24" height="6" fill="#1F2937" opacity="0.85"/>
  <!-- Corpo do frasco -->
  <rect x="36" y="34" width="48" height="52" rx="6" fill="url(#urineGrad)" stroke="#0E2A2F" stroke-width="1.5"/>
  <!-- Brilho lateral -->
  <rect x="40" y="40" width="6" height="42" rx="2" fill="url(#glassGrad)"/>
  <!-- Linha de medição -->
  <line x1="36" y1="52" x2="44" y2="52" stroke="#FFF" stroke-width="0.5" opacity="0.45"/>
  <line x1="36" y1="62" x2="44" y2="62" stroke="#FFF" stroke-width="0.5" opacity="0.45"/>
  <line x1="36" y1="72" x2="44" y2="72" stroke="#FFF" stroke-width="0.5" opacity="0.45"/>
  <text x="46" y="55" fill="#FFF" opacity="0.35" font-size="4" font-family="-apple-system, sans-serif">300</text>
  <text x="46" y="65" fill="#FFF" opacity="0.35" font-size="4" font-family="-apple-system, sans-serif">200</text>
  <text x="46" y="75" fill="#FFF" opacity="0.35" font-size="4" font-family="-apple-system, sans-serif">100</text>
  <!-- Gota cintilante -->
  <path d="M 95 50 Q 92 56, 96 60 Q 100 56, 95 50 Z" fill="#FBBF24" opacity="0.85"/>
  <circle cx="96.5" cy="54" r="0.8" fill="#FFF" opacity="0.7"/>
  <!-- Etiqueta inofensiva -->
  <rect x="44" y="60" width="32" height="14" rx="3" fill="#FFF" opacity="0.92"/>
  <text x="60" y="69" text-anchor="middle" font-family="-apple-system, SF Pro Text, Inter, sans-serif" font-size="6" font-weight="700" fill="#C2410C">inofensiva</text>
  <text x="60" y="75" text-anchor="middle" font-family="-apple-system, SF Pro Text, Inter, sans-serif" font-size="3.5" fill="#9A3412">avise o paciente</text>
</svg>
