<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-labelledby="title">
  <title id="title">Caspofungina — equinocandina (frasco-ampola IV)</title>
  <defs>
    <linearGradient id="caspoVialBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16383F"/>
      <stop offset="100%" stop-color="#0E2A2F"/>
    </linearGradient>
    <linearGradient id="caspoLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#1F8C66"/>
    </linearGradient>
  </defs>
  <!-- Frasco-ampola -->
  <g transform="translate(40,40)">
    <!-- Tampa metálica -->
    <rect x="-12" y="-26" width="24" height="6" rx="1" fill="#8FA1A6" stroke="rgba(11,18,32,0.5)" stroke-width="0.8"/>
    <!-- Anel da tampa -->
    <rect x="-13" y="-22" width="26" height="4" rx="1" fill="#5C6970"/>
    <!-- Gargalo -->
    <rect x="-9" y="-18" width="18" height="4" fill="#16383F" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    <!-- Corpo do frasco -->
    <rect x="-15" y="-14" width="30" height="38" rx="3" fill="url(#caspoVialBody)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <!-- Líquido -->
    <rect x="-13" y="-2" width="26" height="24" rx="1" fill="url(#caspoLiquid)" opacity="0.85"/>
    <!-- Brilho -->
    <line x1="-10" y1="-10" x2="-10" y2="20" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <!-- Etiqueta -->
    <rect x="-14" y="6" width="28" height="10" fill="rgba(255,255,255,0.85)" opacity="0.7"/>
    <text x="0" y="13" text-anchor="middle" fill="#0B1220" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="6" font-weight="700">IV</text>
  </g>
  <text x="40" y="74" text-anchor="middle" fill="#34D399" font-family="-apple-system,sans-serif" font-size="9" font-weight="700" letter-spacing="0.5">CASPO</text>
</svg>
