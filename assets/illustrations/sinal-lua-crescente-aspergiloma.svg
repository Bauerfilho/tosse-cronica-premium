<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" role="img" aria-labelledby="title desc">
  <title id="title">Sinal da lua crescente / menisco — aspergiloma em cavidade tuberculosa</title>
  <desc id="desc">Corte de TC esquemático mostrando cavidade circular fechada com bola fúngica ovoide intracavitária posicionada inferiormente por gravidade, e halo aéreo em meia-lua periférica (sinal da lua crescente ou sinal do menisco).</desc>

  <defs>
    <radialGradient id="cavidadeBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#0E2A2F"/>
    </radialGradient>
    <radialGradient id="bolaFungo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#92671A"/>
    </radialGradient>
    <radialGradient id="lungBg2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16383F"/>
      <stop offset="100%" stop-color="#0E2A2F"/>
    </radialGradient>
  </defs>

  <rect width="540" height="380" fill="#0E2A2F"/>

  <!-- Pulmão silhueta -->
  <ellipse cx="270" cy="195" rx="220" ry="160" fill="none" stroke="#8FA1A6" stroke-width="1.5" opacity="0.7"/>
  <path d="M100,100 C85,170 90,260 130,300 C200,320 270,310 320,300 C400,290 440,230 445,150 C420,110 360,90 270,95 C180,90 130,95 100,100 Z" fill="url(#lungBg2)" stroke="#34D399" stroke-width="2" opacity="0.9"/>

  <!-- Cavidade pré-existente (sequela TB no lobo superior) -->
  <ellipse cx="240" cy="170" rx="100" ry="85" fill="url(#cavidadeBg)" stroke="#FBBF24" stroke-width="3"/>

  <!-- Parede fibrótica espessa (sequela TB) -->
  <ellipse cx="240" cy="170" rx="100" ry="85" fill="none" stroke="#92671A" stroke-width="2" stroke-dasharray="0,0" opacity="0.6"/>

  <!-- Halo aéreo (sinal da lua crescente) — meia-lua superior entre bola e parede -->
  <path d="M150,170 Q150,110 240,108 Q330,110 330,170 Q318,155 240,150 Q162,155 150,170 Z" fill="#0B1220" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="2,2"/>

  <!-- Bola fúngica (massa móvel inferiormente por gravidade) -->
  <ellipse cx="240" cy="200" rx="70" ry="40" fill="url(#bolaFungo)" opacity="0.92"/>
  <ellipse cx="240" cy="200" rx="70" ry="40" fill="none" stroke="#92671A" stroke-width="2"/>

  <!-- Textura interna da bola (hifas + muco + células) -->
  <g stroke="#92671A" stroke-width="0.8" fill="none" opacity="0.55">
    <path d="M195,195 Q220,180 250,195"/>
    <path d="M200,210 Q230,200 270,215"/>
    <path d="M215,225 Q245,220 285,225"/>
    <circle cx="220" cy="195" r="2"/>
    <circle cx="245" cy="205" r="2"/>
    <circle cx="270" cy="200" r="2"/>
  </g>

  <!-- Indicador de gravidade (seta) -->
  <g>
    <line x1="240" y1="105" x2="240" y2="155" stroke="#34D399" stroke-width="1.5" opacity="0.6" stroke-dasharray="3,2"/>
    <polygon points="240,160 236,152 244,152" fill="#34D399" opacity="0.7"/>
    <text x="190" y="135" fill="#34D399" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" font-style="italic">gravidade</text>
  </g>

  <!-- Anotações -->
  <!-- Halo aéreo -->
  <line x1="160" y1="135" x2="100" y2="105" stroke="#FBBF24" stroke-width="1" opacity="0.7"/>
  <text x="20" y="100" fill="#FBBF24" font-family="-apple-system,sans-serif" font-size="11" font-weight="600">halo aéreo</text>
  <text x="20" y="113" fill="#FBBF24" font-family="-apple-system,sans-serif" font-size="9">(meia-lua / menisco)</text>

  <!-- Bola fúngica -->
  <line x1="310" y1="205" x2="430" y2="200" stroke="#FBBF24" stroke-width="1" opacity="0.7"/>
  <text x="435" y="195" fill="#FBBF24" font-family="-apple-system,sans-serif" font-size="11" font-weight="600">bola fúngica</text>
  <text x="435" y="208" fill="#C9D6D9" font-family="-apple-system,sans-serif" font-size="9">fungo + muco + necrose</text>

  <!-- Cavidade prévia -->
  <line x1="340" y1="245" x2="430" y2="270" stroke="#34D399" stroke-width="1" opacity="0.6"/>
  <text x="435" y="265" fill="#34D399" font-family="-apple-system,sans-serif" font-size="11" font-weight="600">cavidade prévia</text>
  <text x="435" y="278" fill="#C9D6D9" font-family="-apple-system,sans-serif" font-size="9">(sequela TB pós-curativa)</text>

  <!-- Painel comparativo: decúbito muda posição -->
  <g transform="translate(60,290)">
    <text x="0" y="0" fill="#8FA1A6" font-family="-apple-system,sans-serif" font-size="10" font-weight="600">Decúbito muda posição da bola →</text>

    <g transform="translate(0,8)">
      <ellipse cx="40" cy="30" rx="35" ry="22" fill="#0B1220" stroke="#FBBF24" stroke-width="1.5"/>
      <ellipse cx="40" cy="42" rx="22" ry="10" fill="#FBBF24" opacity="0.8"/>
      <text x="40" y="68" text-anchor="middle" fill="#C9D6D9" font-family="-apple-system,sans-serif" font-size="9">decúbito dorsal</text>
    </g>

    <g transform="translate(120,8)">
      <ellipse cx="40" cy="30" rx="35" ry="22" fill="#0B1220" stroke="#FBBF24" stroke-width="1.5"/>
      <ellipse cx="40" cy="20" rx="22" ry="10" fill="#FBBF24" opacity="0.8"/>
      <text x="40" y="68" text-anchor="middle" fill="#C9D6D9" font-family="-apple-system,sans-serif" font-size="9">decúbito ventral</text>
    </g>
  </g>

  <!-- Legenda final -->
  <text x="270" y="370" text-anchor="middle" fill="#8FA1A6" font-family="-apple-system,sans-serif" font-size="10" font-style="italic">Conteúdo móvel ao mudar decúbito = praticamente patognomônico de aspergiloma</text>
</svg>
