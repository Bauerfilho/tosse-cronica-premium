<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" role="img" aria-label="Radiografia esquemática de TB primária pediátrica: adenopatia hilar unilateral à direita">
  <defs>
    <linearGradient id="rxubg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#34D399" stroke-opacity=".05" stop-opacity=".05"/>
    </linearGradient>
    <radialGradient id="rxuaden" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity=".75"/>
      <stop offset="70%" stop-color="#34D399" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="320" height="360" rx="14" fill="url(#rxubg)"/>

  <!-- Silhueta torácica -->
  <g transform="translate(160, 180)" stroke="#8FA1A6" stroke-width="1.4" fill="none">
    <!-- Caixa torácica externa -->
    <path d="M -110,-110 Q -120,-30 -110,80 L -90,110 L 90,110 L 110,80 Q 120,-30 110,-110 L 70,-130 L -70,-130 Z" opacity=".55"/>

    <!-- Costelas estilizadas (3 pares) -->
    <path d="M -100,-60 Q -50,-50 0,-55" opacity=".25"/>
    <path d="M 100,-60 Q 50,-50 0,-55" opacity=".25"/>
    <path d="M -100,-20 Q -50,-10 0,-15" opacity=".25"/>
    <path d="M 100,-20 Q 50,-10 0,-15" opacity=".25"/>
    <path d="M -100,20 Q -50,30 0,25" opacity=".25"/>
    <path d="M 100,20 Q 50,30 0,25" opacity=".25"/>

    <!-- Coluna central -->
    <line x1="0" y1="-130" x2="0" y2="110" stroke="#8FA1A6" stroke-width="1" opacity=".4" stroke-dasharray="3,3"/>

    <!-- Coração (silhueta levemente à esquerda) -->
    <path d="M -8,40 Q -38,30 -42,70 Q -38,100 0,100 Q 30,100 25,70 Q 22,30 -8,40 Z" opacity=".5" stroke-dasharray="0"/>

    <!-- Diafragma -->
    <path d="M -100,90 Q -50,110 0,100 Q 50,90 100,90" stroke="#8FA1A6" stroke-width="1.5" opacity=".7"/>
  </g>

  <!-- ADENOPATIA HILAR UNILATERAL À DIREITA (do paciente — esquerda na imagem como em Rx frontal padrão) -->
  <g transform="translate(120, 175)">
    <circle r="34" fill="url(#rxuaden)"/>
    <!-- Aglomerado de linfonodos -->
    <ellipse cx="-6" cy="-4" rx="10" ry="7" fill="#34D399" opacity=".45"/>
    <ellipse cx="8" cy="2" rx="8" ry="6" fill="#34D399" opacity=".4"/>
    <ellipse cx="-2" cy="8" rx="7" ry="5" fill="#34D399" opacity=".35"/>
  </g>

  <!-- Indicador / Marker -->
  <g transform="translate(60, 175)">
    <circle cx="0" cy="0" r="4" fill="#34D399"/>
    <line x1="4" y1="0" x2="48" y2="0" stroke="#34D399" stroke-width="1.4"/>
  </g>

  <!-- Legenda lateral -->
  <text x="20" y="170" font-family="-apple-system, SF Pro Display, system-ui, sans-serif" font-size="9" fill="#34D399" font-weight="600" letter-spacing=".03em">ADENOPATIA</text>
  <text x="20" y="184" font-family="-apple-system, SF Pro Display, system-ui, sans-serif" font-size="9" fill="#34D399" font-weight="600" letter-spacing=".03em">HILAR DIREITA</text>

  <!-- Anatomia básica de marcação -->
  <text x="280" y="60" text-anchor="end" font-family="-apple-system, SF Pro Display, system-ui, sans-serif" font-size="10" fill="#8FA1A6" font-weight="600">R</text>
  <text x="40" y="60" font-family="-apple-system, SF Pro Display, system-ui, sans-serif" font-size="10" fill="#8FA1A6" font-weight="600">L</text>

  <!-- Legenda inferior -->
  <text x="160" y="335" text-anchor="middle" font-family="-apple-system, SF Pro Display, system-ui, sans-serif" font-size="11" fill="#C9D6D9" font-weight="600">TB primária pediátrica</text>
  <text x="160" y="349" text-anchor="middle" font-family="-apple-system, SF Pro Display, system-ui, sans-serif" font-size="9" fill="#8FA1A6" font-style="italic">Adenopatia hilar unilateral (preferência à direita)</text>
</svg>
