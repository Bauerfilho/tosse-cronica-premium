<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Estomatite moriforme em paracoccidioidomicose: lesão oral vegetante com superfície granulada e pontilhado hemorrágico característico (aspecto de amora)">
  <title>Estomatite moriforme — clínica oral</title>
  <desc>Lesão oral vegetante com superfície granulada e múltiplos pontos hemorrágicos finos (aspecto de amora), localizada em gengiva e palato. Patognomônico clínico da paracoccidioidomicose crônica do adulto.</desc>

  <defs>
    <radialGradient id="oral-bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#3a1f24"/>
      <stop offset="100%" stop-color="#1a0c0f"/>
    </radialGradient>
    <radialGradient id="mucosa" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d97a8c" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#a64457" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="lesao-amora" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4595e" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#8e3540" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5a1f28" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <!-- Fundo cavidade oral -->
  <rect width="400" height="400" fill="url(#oral-bg)"/>

  <!-- Lábio superior contorno -->
  <path d="M 50 100 Q 110 75 200 70 Q 290 75 350 100 Q 340 130 320 138 Q 280 145 200 142 Q 120 145 80 138 Q 60 130 50 100 Z"
        fill="#7a3540" stroke="#4a1f28" stroke-width="1.5" opacity="0.85"/>

  <!-- Cavidade oral (abertura) -->
  <path d="M 80 138 Q 200 160 320 138 L 320 280 Q 250 305 200 305 Q 150 305 80 280 Z"
        fill="#1a0c0f" opacity="0.95"/>

  <!-- Gengiva superior (mucosa rosada) -->
  <path d="M 90 145 Q 200 165 310 145 Q 305 175 300 180 Q 250 195 200 195 Q 150 195 100 180 Q 95 175 90 145 Z"
        fill="url(#mucosa)" opacity="0.9"/>

  <!-- Dentes superiores -->
  <g fill="#f4f7fb" opacity="0.7">
    <rect x="115" y="155" width="15" height="22" rx="3"/>
    <rect x="135" y="156" width="14" height="22" rx="3"/>
    <rect x="153" y="156" width="14" height="22" rx="3"/>
    <rect x="171" y="156" width="14" height="22" rx="3"/>
    <rect x="189" y="156" width="14" height="22" rx="3"/>
    <rect x="207" y="156" width="14" height="22" rx="3"/>
    <rect x="225" y="156" width="14" height="22" rx="3"/>
    <rect x="243" y="156" width="14" height="22" rx="3"/>
    <rect x="261" y="155" width="15" height="22" rx="3"/>
  </g>

  <!-- LESÃO PRINCIPAL MORIFORME (gengiva superior anterior) -->
  <ellipse cx="200" cy="138" rx="62" ry="20" fill="url(#lesao-amora)" stroke="#5a1f28" stroke-width="1.5"/>

  <!-- Pontilhado hemorrágico característico (aspecto de amora) — pontos vermelhos densos -->
  <g fill="#5a0d18">
    <circle cx="170" cy="135" r="1.8"/>
    <circle cx="178" cy="138" r="1.5"/>
    <circle cx="185" cy="133" r="1.7"/>
    <circle cx="192" cy="139" r="1.6"/>
    <circle cx="200" cy="134" r="1.8"/>
    <circle cx="208" cy="139" r="1.5"/>
    <circle cx="215" cy="133" r="1.7"/>
    <circle cx="222" cy="138" r="1.6"/>
    <circle cx="230" cy="135" r="1.5"/>
    <circle cx="165" cy="142" r="1.6"/>
    <circle cx="173" cy="146" r="1.5"/>
    <circle cx="180" cy="143" r="1.7"/>
    <circle cx="188" cy="147" r="1.4"/>
    <circle cx="195" cy="143" r="1.8"/>
    <circle cx="203" cy="146" r="1.5"/>
    <circle cx="210" cy="142" r="1.6"/>
    <circle cx="218" cy="146" r="1.5"/>
    <circle cx="225" cy="143" r="1.7"/>
    <circle cx="232" cy="146" r="1.4"/>
    <circle cx="178" cy="129" r="1.5"/>
    <circle cx="195" cy="127" r="1.6"/>
    <circle cx="213" cy="127" r="1.4"/>
    <circle cx="225" cy="129" r="1.5"/>
  </g>

  <!-- Texturização granulada adicional (pequenos puffs claros pra dar aspecto vegetante) -->
  <g fill="#c97a8a" opacity="0.5">
    <circle cx="155" cy="138" r="2.2"/>
    <circle cx="165" cy="135" r="1.8"/>
    <circle cx="178" cy="142" r="2"/>
    <circle cx="195" cy="138" r="2.4"/>
    <circle cx="215" cy="138" r="2.2"/>
    <circle cx="228" cy="142" r="1.8"/>
    <circle cx="240" cy="138" r="2"/>
  </g>

  <!-- Lesão secundária menor em mucosa jugal direita -->
  <ellipse cx="320" cy="220" rx="22" ry="14" fill="url(#lesao-amora)" stroke="#5a1f28" stroke-width="1.2"/>
  <g fill="#5a0d18">
    <circle cx="308" cy="218" r="1.3"/>
    <circle cx="315" cy="222" r="1.5"/>
    <circle cx="320" cy="218" r="1.4"/>
    <circle cx="325" cy="222" r="1.3"/>
    <circle cx="330" cy="218" r="1.5"/>
  </g>

  <!-- Lesão pequena em mucosa jugal esquerda -->
  <ellipse cx="78" cy="225" rx="18" ry="11" fill="url(#lesao-amora)" stroke="#5a1f28" stroke-width="1.2"/>
  <g fill="#5a0d18">
    <circle cx="70" cy="223" r="1.3"/>
    <circle cx="77" cy="227" r="1.4"/>
    <circle cx="82" cy="223" r="1.3"/>
    <circle cx="87" cy="227" r="1.4"/>
  </g>

  <!-- Língua (sutil ao fundo) -->
  <ellipse cx="200" cy="265" rx="80" ry="22" fill="#a64457" opacity="0.6"/>

  <!-- Lábio inferior contorno -->
  <path d="M 80 280 Q 130 308 200 305 Q 270 308 320 280 Q 340 310 320 345 Q 280 365 200 365 Q 120 365 80 345 Q 60 310 80 280 Z"
        fill="#7a3540" stroke="#4a1f28" stroke-width="1.5" opacity="0.85"/>

  <!-- Legenda inferior discreta -->
  <text x="200" y="392" text-anchor="middle" fill="#d97a8c" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="500" letter-spacing="0.04em" opacity="0.85">
    Estomatite moriforme · pontilhado hemorrágico em gengiva e mucosa jugal
  </text>
</svg>
