<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E2A2F">
  <meta name="description" content="Plataforma educacional médica sobre tosse crônica, tuberculose e diagnósticos diferenciais — padrão Bauer.">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./assets/favicons/icon.svg">

  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components/glass.css">
  <link rel="stylesheet" href="./css/components/cards.css">
  <link rel="stylesheet" href="./css/components/case-timeline.css">
  <link rel="stylesheet" href="./css/components/duration-table.css">
  <link rel="stylesheet" href="./css/components/interactive-question.css">
  <link rel="stylesheet" href="./css/components/roadmap-card.css">
  <link rel="stylesheet" href="./css/components/pwa-install.css">
  <link rel="stylesheet" href="./css/components/comparison-table.css">
  <link rel="stylesheet" href="./css/components/score-diagram.css">
  <link rel="stylesheet" href="./css/components/cross-link-card.css">
  <link rel="stylesheet" href="./css/components/treatment-timeline.css">
  <link rel="stylesheet" href="./css/components/decision-flow.css">
  <link rel="stylesheet" href="./css/components/risk-comparison.css">
  <link rel="stylesheet" href="./css/pages/a1.css">
  <link rel="stylesheet" href="./css/pages/a2.css">
  <link rel="stylesheet" href="./css/pages/a3.css">
  <link rel="stylesheet" href="./css/pages/a4.css">
  <link rel="stylesheet" href="./css/pages/a5.css">
  <link rel="stylesheet" href="./css/pages/a7.css">
  <link rel="stylesheet" href="./css/pages/a6.css">
  <link rel="stylesheet" href="./css/responsive.css">

  <title>Tosse Crônica e Tuberculose — TB Bauer</title>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">TB</div>
        <div class="brand-text">
          <span class="brand-title">Tosse Crônica e Tuberculose</span>
          <span class="brand-sub">Plataforma Bauer · Infectologia</span>
        </div>
      </div>
      <div class="header-actions">
        <button
          type="button"
          class="icon-btn menu-toggle"
          data-menu-toggle
          aria-expanded="false"
          aria-controls="aulaNav"
          aria-label="Abrir menu de páginas">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <button
          type="button"
          class="icon-btn"
          id="pwaInstallBtn"
          data-pwa-install
          hidden
          aria-label="Instalar plataforma como app">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span class="update-badge" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <main class="app-main">
      <aside id="aulaNav" class="aula-nav" data-aula-nav aria-label="Menu da aula"></aside>
      <div data-app-root role="main" aria-live="polite">
        <article class="page">
          <h1>Carregando…</h1>
        </article>
      </div>
    </main>

    <footer class="app-footer">
      <p>Plataforma educacional médica · padrão Bauer · uso pedagógico</p>
    </footer>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
